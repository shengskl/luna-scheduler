<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFBFE">
  <meta name="description" content="Luna排班表，5 天循环排班，纯本地运行。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Luna排班表">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Luna排班表</title>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <h1 class="brand">Luna排班表</h1>
      <div class="top-actions">
        <button class="text-button" id="todayButton" type="button">今天</button>
        <button class="icon-button" id="settingsButton" type="button" aria-label="设置">
          <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94c0-.32-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.24-1.12.55-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.74 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94 0 .32.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.34.68.22l2.39-.96c.5.39 1.04.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.24 1.12-.55 1.62-.94l2.39.96c.26.12.54.02.68-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="calendarView">
      <div id="firstRunBanner" class="banner hidden">
        <div class="banner-text">
          <strong>先设置你的周期起点</strong>
          <span>当前默认把今天当作第 1 天白班，设置后日期才准确。</span>
        </div>
        <button class="text-button" id="bannerSettingsButton" type="button">去设置</button>
      </div>

      <section class="calendar-card" aria-label="月历">
        <div class="month-header">
          <button class="icon-button" id="prevMonthButton" type="button" aria-label="上个月">‹</button>
          <h2 id="monthTitle"></h2>
          <button class="icon-button" id="nextMonthButton" type="button" aria-label="下个月">›</button>
        </div>
        <div class="weekdays" id="weekdays" aria-hidden="true"></div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div class="legend" id="legend"></div>
      </section>

      <section class="today-card" id="todayCard" aria-label="今天"></section>

      <section id="statsCard" aria-label="本月统计"></section>
    </main>

    <main id="settingsView" class="settings-view hidden">
      <div class="settings-header">
        <button class="icon-button" id="settingsBackButton" type="button" aria-label="返回">←</button>
        <h2>设置</h2>
        <span class="settings-header-spacer"></span>
      </div>

      <section class="settings-section">
        <h3>周期设置</h3>
        <div class="settings-card">
          <label class="setting-row" for="anchorInput">
            <span class="setting-copy">
              <span class="setting-title">周期第 1 天</span>
              <span class="setting-subtitle">选一个白班日期，作为 5 天循环的起点</span>
            </span>
            <input class="setting-input" type="date" id="anchorInput">
          </label>
          <div class="divider"></div>
          <label class="setting-row" for="dayStartInput">
            <span class="setting-copy">
              <span class="setting-title">白班开始时间</span>
              <span class="setting-subtitle">白班结束时间固定为 17:30</span>
            </span>
            <input class="setting-input" type="time" id="dayStartInput" max="17:29">
          </label>
          <div class="divider"></div>
          <div class="setting-row">
            <span class="setting-copy">
              <span class="setting-title">夜班时间</span>
              <span class="setting-subtitle">周末下夜班延长到 12:00</span>
            </span>
            <span class="setting-value" id="nightTimeValue">17:30 – 次日 08:00</span>
          </div>
          <div class="divider"></div>
          <label class="setting-row" for="weekendToggle">
            <span class="setting-copy">
              <span class="setting-title">周末下夜班延至 12:00</span>
              <span class="setting-subtitle">第 4 天是周六/周日时生效</span>
            </span>
            <span class="switch">
              <input type="checkbox" id="weekendToggle">
              <span class="switch-track"></span>
            </span>
          </label>
        </div>
      </section>

      <section class="settings-section">
        <h3>快速校准</h3>
        <div class="settings-card settings-pad">
          <p class="hint primary-text" id="todayCycleText"></p>
          <p class="hint">如果忘了周期起点，直接选择今天在 5 天循环中的位置，App 会自动倒推。</p>
          <div class="chips" id="calibrateChips">
            <button class="chip" type="button" data-cycle="1">第1天</button>
            <button class="chip" type="button" data-cycle="2">第2天</button>
            <button class="chip" type="button" data-cycle="3">第3天</button>
            <button class="chip" type="button" data-cycle="4">第4天</button>
            <button class="chip" type="button" data-cycle="5">第5天</button>
          </div>
        </div>
      </section>

      <section class="settings-section">
        <h3>显示</h3>
        <div class="settings-card settings-pad">
          <span class="setting-title">主题</span>
          <div class="chips" id="themeChips">
            <button class="chip" type="button" data-theme="system">跟随系统</button>
            <button class="chip" type="button" data-theme="light">浅色</button>
            <button class="chip" type="button" data-theme="dark">深色</button>
          </div>
        </div>
      </section>

      <section class="settings-section">
        <h3>关于</h3>
        <div class="settings-card settings-pad about-card">
          <strong>Luna排班表 PWA v1.0.0</strong>
          <p>纯本地应用，不联网、不收集信息。设置只保存在当前浏览器中。</p>
          <p>排班规则：5 天循环，白班 → 休息 → 夜班 → 下夜班 → 休息。</p>
          <p class="muted">提示：清理浏览器数据或删除主屏幕图标，可能会清除本地设置。</p>
        </div>
      </section>
    </main>

    <div class="backdrop hidden" id="detailBackdrop"></div>
    <section class="sheet hidden" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div>
          <h2 id="detailTitle"></h2>
          <p class="sheet-subtitle" id="detailSubtitle"></p>
        </div>
        <button class="icon-button" id="detailCloseButton" type="button" aria-label="关闭">×</button>
      </div>
      <div class="sheet-body" id="detailBody"></div>
    </section>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
